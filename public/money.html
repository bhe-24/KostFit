<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KostFit - Keuangan</title>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    /* === CSS GLOBAL === */
    :root {
      --primary: #2ECC71;
      --secondary: #3498DB;
      --danger: #E74C3C;
      --bg-color: #F8F9F9;
      --text-main: #2C3E50;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #E5E8E8; display: flex; justify-content: center; }

    #app-container {
      background-color: var(--bg-color);
      width: 100%; max-width: 480px; min-height: 100vh;
      display: flex; flex-direction: column;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    header {
      background-color: var(--secondary); color: white;
      padding: 15px; display: flex; align-items: center;
    }
    .back-btn {
      background: none; border: none; color: white;
      font-size: 20px; cursor: pointer; margin-right: 15px;
    }

    main { flex: 1; padding: 15px; overflow-y: auto; }

    .card {
      background: white; border-radius: 12px; padding: 20px;
      margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .btn-download {
      background-color: var(--text-main); color: white;
      border: none; padding: 12px; border-radius: 10px;
      width: 100%; font-size: 16px; font-weight: bold;
      cursor: pointer; margin-bottom: 15px;
    }

    .budget-status {
      text-align: center; padding: 15px; border-radius: 10px;
      margin-bottom: 15px; font-weight: bold;
    }
    .status-safe { background-color: #D4EFDF; color: var(--primary); }
    .status-danger { background-color: #FDEDEC; color: var(--danger); border: 2px solid var(--danger); }

    .transaction-item {
      display: flex; justify-content: space-between;
      padding: 12px 0; border-bottom: 1px solid #eee;
    }
    .item-name { font-weight: 500; }
    .item-price { color: var(--text-main); font-weight: bold; }
  </style>
</head>
<body>

  <div id="app-container">
    <header>
      <button class="back-btn" onclick="window.location.href='index.html'">←</button>
      <h2>Keuangan</h2>
    </header>

    <main id="money-report">
      <button class="btn-download" onclick="downloadMoneyPDF()">📥 Cetak Laporan Keuangan</button>

      <section class="card">
        <h3 style="text-align: center; color: var(--text-main);">Total Minggu Ini</h3>
        <h1 id="total-spend" style="margin: 10px 0; text-align: center;">Rp 0</h1>
        <div id="budget-info" class="budget-status status-safe">
          Memeriksa data...
        </div>
      </section>

      <section class="card">
        <h3 style="text-align: center; color: var(--text-main); margin-bottom: 10px;">Alokasi Dana</h3>
        <canvas id="moneyChart"></canvas>
      </section>

      <section class="card">
        <h3 style="color: var(--text-main); border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 10px;">Riwayat Jajan</h3>
        <div id="history-list">
          <p style="text-align: center; color: #7F8C8D; font-size: 14px;">Memuat riwayat transaksimu...</p>
        </div>
      </section>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";
    // IMPORT AUTH
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDooErB7K4vFtmC6-PcI30v82Vh6b85fPI",
      authDomain: "berbasis-ai.firebaseapp.com",
      projectId: "berbasis-ai",
      storageBucket: "berbasis-ai.firebasestorage.app",
      messagingSenderId: "962437652324",
      appId: "1:962437652324:web:4426a5efcabf72caebe471"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const TARGET_MINGGUAN = 300000;
    let chartInstance = null;

    // CEK LOGIN SEBELUM MENARIK DATA
    onAuthStateChanged(auth, (user) => {
      if (user) {
        loadFinanceData(user.uid);
      } else {
        window.location.href = "auth.html"; // Usir jika belum login
      }
    });

    async function loadFinanceData(userId) {
      try {
        // HANYA TARIK DATA MILIK USER INI
        const q = query(collection(db, "laporan_harian"), where("userId", "==", userId));
        const querySnapshot = await getDocs(q);
        
        let rawData = [];
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          if (data.harga > 0) {
            rawData.push(data);
          }
        });

        // Urutkan dari yang terbaru ke yang terlama
        rawData.sort((a, b) => {
          const timeA = a.waktu_input ? a.waktu_input.toMillis() : 0;
          const timeB = b.waktu_input ? b.waktu_input.toMillis() : 0;
          return timeB - timeA; 
        });

        let total = 0;
        let categories = { "makanan": 0, "lain-lain": 0 };
        const historyList = document.getElementById('history-list');
        historyList.innerHTML = "";

        if (rawData.length === 0) {
          historyList.innerHTML = `<p style="text-align: center; color: #7F8C8D; font-size: 14px;">Belum ada pengeluaran yang dicatat.</p>`;
        } else {
          rawData.forEach((data) => {
            total += data.harga;
            
            // Pengelompokan Kategori untuk Chart
            const kat = data.kategori ? data.kategori.toLowerCase() : "lain-lain";
            categories[kat] = (categories[kat] || 0) + data.harga;

            // Render list
            historyList.innerHTML += `
              <div class="transaction-item">
                <span class="item-name">${data.item || "Barang tidak diketahui"}</span>
                <span class="item-price">Rp ${data.harga.toLocaleString('id-ID')}</span>
              </div>
            `;
          });
        }

        // Update UI Total & Status Merah
        const totalText = document.getElementById('total-spend');
        const statusBox = document.getElementById('budget-info');
        
        totalText.innerText = `Rp ${total.toLocaleString('id-ID')}`;
        
        if (total > TARGET_MINGGUAN) {
          totalText.style.color = "var(--danger)";
          statusBox.innerText = "🚨 OVERBUDGET!";
          statusBox.className = "budget-status status-danger";
        } else {
          statusBox.innerText = `Sisa kuota aman: Rp ${(TARGET_MINGGUAN - total).toLocaleString('id-ID')}`;
        }

        renderMoneyChart(Object.keys(categories), Object.values(categories));

      } catch (error) {
        console.error("Gagal menarik data keuangan: ", error);
        document.getElementById('history-list').innerHTML = `<p style="text-align: center; color: red;">Gagal memuat data.</p>`;
      }
    }

    function renderMoneyChart(labels, dataValues) {
      const ctx = document.getElementById('moneyChart').getContext('2d');
      
      if(chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: labels,
          datasets: [{
            data: dataValues,
            backgroundColor: ['#2ECC71', '#3498DB', '#F1C40F', '#E74C3C']
          }]
        }
      });
    }
  </script>

  <script>
    function downloadMoneyPDF() {
      const btn = document.querySelector('.btn-download');
      btn.style.display = 'none';
      const element = document.getElementById('money-report');
      html2pdf().from(element).save('Laporan_Keuangan_KostFit.pdf').then(() => {
        btn.style.display = 'block';
      });
    }
  </script>
</body>
</html>
