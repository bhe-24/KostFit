<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KostFit - Mode Diet</title>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    /* === CSS GLOBAL === */
    :root {
      --primary: #2ECC71;
      --secondary: #3498DB;
      --danger: #E74C3C;
      --bg-color: #F8F9F9;
      --text-main: #2C3E50;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #E5E8E8; display: flex; justify-content: center; }

    #app-container {
      background-color: var(--bg-color);
      width: 100%; max-width: 480px; min-height: 100vh;
      display: flex; flex-direction: column;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    header {
      background-color: var(--primary); color: white;
      padding: 15px; display: flex; align-items: center;
    }
    .back-btn {
      background: none; border: none; color: white;
      font-size: 20px; cursor: pointer; margin-right: 15px;
      font-weight: bold;
    }

    main { flex: 1; padding: 15px; }

    .card {
      background: white; border-radius: 12px; padding: 20px;
      margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    h3 { color: var(--text-main); margin-bottom: 15px; text-align: center; }

    .btn-download {
      background-color: var(--text-main); color: white;
      border: none; padding: 12px; border-radius: 10px;
      width: 100%; font-size: 16px; font-weight: bold;
      cursor: pointer; margin-bottom: 15px;
    }

    .alert-red {
      color: var(--danger); font-weight: bold;
      background-color: #FDEDEC; padding: 10px;
      border-radius: 8px; margin-bottom: 5px;
      border-left: 4px solid var(--danger);
    }

    ul { list-style-type: none; }
    li { padding: 8px 0; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>

  <div id="app-container">
    <header>
      <button class="back-btn" onclick="window.location.href='index.html'">←</button>
      <h2>Laporan Diet</h2>
    </header>

    <main id="laporan-area">
      <button class="btn-download" onclick="downloadPDF()">📥 Unduh PDF Laporan</button>

      <section class="card">
        <h3>Diagram Kalori (Terbaru)</h3>
        <canvas id="dietChart"></canvas>
      </section>

      <section class="card">
        <h3>🚨 Peringatan Makanan</h3>
        <ul id="warning-list">
          <li style="color: #7F8C8D; text-align: center; font-size: 14px;">Memeriksa akun...</li>
        </ul>
      </section>

      <section class="card">
        <h3>💡 Pola Hidup Sehat</h3>
        <p style="font-size: 14px; color: #555; line-height: 1.5;">
          Sebagai anak kost, pastikan minum air putih minimal 2 liter per hari. Kurangi gorengan dan perbanyak sayur berkuah (seperti sayur sop atau bayam) yang murah dan sehat!
        </p>
      </section>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy, where } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore.js";
    // IMPORT AUTH
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDooErB7K4vFtmC6-PcI30v82Vh6b85fPI",
      authDomain: "berbasis-ai.firebaseapp.com",
      projectId: "berbasis-ai",
      storageBucket: "berbasis-ai.firebasestorage.app",
      messagingSenderId: "962437652324",
      appId: "1:962437652324:web:4426a5efcabf72caebe471"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let chartInstance = null; // Menyimpan status chart agar tidak error saat di-update

    // CEK LOGIN SEBELUM MENARIK DATA
    onAuthStateChanged(auth, (user) => {
      if (user) {
        loadDietData(user.uid);
      } else {
        window.location.href = "auth.html"; // Usir jika belum login
      }
    });

    // Fungsi memuat data KHUSUS untuk akun yang login
    async function loadDietData(userId) {
      document.getElementById("warning-list").innerHTML = `<li style="text-align:center;">Memuat data...</li>`;
      try {
        // FILTER: Hanya ambil data yang userId-nya sama dengan akun saat ini
        const q = query(
          collection(db, "laporan_harian"), 
          where("userId", "==", userId)
        );
        const querySnapshot = await getDocs(q);
        
        let makananFrekuensi = {};
        // Data sementara untuk di-sort nanti
        let rawData = []; 

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          if(data.kategori === "makanan" && data.kalori > 0) {
            rawData.push(data);
            
            // Hitung frekuensi makanan
            const itemLCase = data.item ? data.item.toLowerCase() : "tidak diketahui";
            makananFrekuensi[itemLCase] = (makananFrekuensi[itemLCase] || 0) + 1;
          }
        });

        // Urutkan data berdasarkan waktu terbaru (karena 'where' dan 'orderBy' sering konflik di Firebase tanpa index manual)
        rawData.sort((a, b) => {
          const timeA = a.waktu_input ? a.waktu_input.toMillis() : 0;
          const timeB = b.waktu_input ? b.waktu_input.toMillis() : 0;
          return timeB - timeA; // Descending (Terbaru di atas)
        });

        // Ambil 5 data terbaru untuk chart
        let namaMakanan = [];
        let jumlahKalori = [];
        for(let i = 0; i < Math.min(5, rawData.length); i++) {
          namaMakanan.push(rawData[i].item);
          jumlahKalori.push(rawData[i].kalori);
        }

        // 1. Render Diagram Chart.js
        renderChart(namaMakanan.reverse(), jumlahKalori.reverse()); // Reverse agar urutan kiri-kanan sesuai waktu

        // 2. Render Peringatan
        const warningList = document.getElementById("warning-list");
        warningList.innerHTML = ""; 
        let adaPeringatan = false;

        for (const [makanan, jumlah] of Object.entries(makananFrekuensi)) {
          if(jumlah > 2) {
            adaPeringatan = true;
            warningList.innerHTML += `<li class="alert-red">Kamu makan <b>${makanan}</b> sebanyak ${jumlah}x! Hati-hati ya.</li>`;
          }
        }
        
        if(!adaPeringatan) {
          warningList.innerHTML = `<li style="color: var(--primary); text-align:center;">Mantap! Pola makanmu masih aman.</li>`;
        }

      } catch (error) {
        console.error("Gagal memuat data:", error);
        document.getElementById("warning-list").innerHTML = `<li style="color:red; text-align:center;">Gagal menarik data. ${error.message}</li>`;
      }
    }

    function renderChart(labels, dataKalori) {
      const ctx = document.getElementById('dietChart').getContext('2d');
      
      // Hapus chart lama jika ada, agar tidak menumpuk
      if(chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Estimasi Kalori',
            data: dataKalori,
            backgroundColor: '#2ECC71',
            borderRadius: 5
          }]
        },
        options: {
          responsive: true,
          scales: { y: { beginAtZero: true } }
        }
      });
    }
  </script>

  <script>
    function downloadPDF() {
      const btn = document.querySelector('.btn-download');
      btn.style.display = 'none';

      const element = document.getElementById('laporan-area');
      const opt = {
        margin:       10,
        filename:     'Laporan_Diet_KostFit.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(element).save().then(() => {
        btn.style.display = 'block';
      });
    }
  </script>

</body>
</html>
