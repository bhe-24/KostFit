<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KostFit App</title>
  
  <style>
    /* === CSS GLOBAL & MOBILE-FIRST === */
    :root {
      --primary: #2ECC71; /* Hijau untuk kesehatan/diet */
      --secondary: #3498DB; /* Biru untuk keuangan */
      --danger: #E74C3C; /* Merah untuk peringatan */
      --bg-color: #F8F9F9;
      --text-main: #2C3E50;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #E5E8E8; /* Background luar abu-abu */
      display: flex;
      justify-content: center; /* Posisi di tengah untuk tampilan desktop */
    }

    /* Container utama pembatas layar HP */
    #app-container {
      background-color: var(--bg-color);
      width: 100%;
      max-width: 480px; /* Ukuran maksimal layar mobile */
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    /* === HEADER === */
    header {
      background-color: var(--primary);
      color: white;
      text-align: center;
      padding: 20px 15px;
      border-bottom-left-radius: 15px;
      border-bottom-right-radius: 15px;
    }

    header h1 {
      font-size: 24px;
      letter-spacing: 1px;
    }

    /* === NAVIGASI === */
    nav {
      display: flex;
      justify-content: space-around;
      padding: 20px 15px;
    }

    .nav-btn {
      flex: 1;
      margin: 0 5px;
      padding: 15px 10px;
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }

    .nav-btn:active {
      transform: scale(0.95);
    }

    .btn-diet { background-color: var(--primary); }
    .btn-money { background-color: var(--secondary); }

    /* === KONTEN UTAMA === */
    main {
      flex: 1;
      padding: 15px;
    }

    /* Card Styling */
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .card h3 {
      color: var(--text-main);
      margin-bottom: 10px;
    }

    .btn-chat {
      margin-top: 10px;
      background-color: var(--text-main);
      color: white;
      border: none;
      padding: 15px 20px;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
      font-size: 16px;
      font-weight: 500;
    }

    .summary-item:last-child {
      border-bottom: none;
    }

    .value-diet { color: var(--primary); font-weight: bold; }
    .value-money { color: var(--danger); font-weight: bold; } /* Merah untuk pengeluaran */

    /* === FOOTER === */
    footer {
      text-align: center;
      padding: 15px;
      color: #7F8C8D;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <header>
      <h1>KostFit App</h1>
      <p style="font-size: 14px; margin-top: 5px; opacity: 0.9;">Catat Diet & Keuanganmu</p>
    </header>

    <nav>
      <button class="nav-btn btn-diet" onclick="window.location.href='diet.html'">🎯 Mode Diet</button>
      <button class="nav-btn btn-money" onclick="window.location.href='money.html'">💰 Keuangan</button>
    </nav>

    <main>
      <section class="card">
        <h3>Laporan Hari Ini</h3>
        <p style="color: #7F8C8D; font-size: 14px; margin-bottom: 15px;">Habis makan apa atau beli apa? Lapor ke AI sekarang!</p>
        <button class="btn-chat" onclick="window.location.href='chat.html'">💬 Chat AI Tracker</button>
      </section>

      <section class="card">
        <h3>Ringkasan Singkat</h3>
        <div class="summary-item">
          <span>Kalori Masuk:</span>
          <span class="value-diet" id="today-cal">0 kkal</span>
        </div>
        <div class="summary-item">
          <span>Pengeluaran:</span>
          <span class="value-money" id="today-expense">Rp 0</span>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 KostFit App</p>
    </footer>
  </div>

</body>
</html>
